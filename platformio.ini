; Waveshare ESP32-C6-LCD-1.47  (ESP32-C6, ST7789 172x320 IPS)
; BLE scanner PoC
;
; NOTE: ESP32-C6 + Arduino needs the pioarduino platform fork.
; The official "espressif32" platform does not build for C6 with Arduino.
;
; Pinned to 53.03.13-1 (Arduino-ESP32 3.1.3 / ESP-IDF 5.3) on purpose: it uses
; the classic PlatformIO tool packages. The 54.x/55.x line switched to an
; "esp_install" step that runs uv against PlatformIO's own penv and can corrupt
; the Core install on Windows.

[env:esp32-c6-lcd-1_47]
platform = https://github.com/pioarduino/platform-espressif32.git#53.03.13-1
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; Route Serial to the native USB-C port (USB Serial/JTAG on the C6)
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=3

lib_deps =
	moononournation/GFX Library for Arduino @ ^1.6.7
	h2zero/NimBLE-Arduino @ ^2.5.1
